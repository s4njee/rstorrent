# Build and publish the desktop app (the native GPUI shell) for macOS and Windows.
#
# Produces two artifacts:
#   * macOS   — rstorrent-<ver>-macos-arm64.zip   (the .app, bundled rtorrent
#               inside, zipped with ditto; tools/bundle-gpui-macos.sh)
#   * Windows — rstorrent-<ver>-windows-x64.zip   (portable folder: the exe plus
#               runtime\rstorrent-rootfs.tar.gz; tools/bundle-gpui-windows.ps1)
#
# The Windows runtime is a Linux rtorrent in a WSL root filesystem, so it is
# built by its own ubuntu job (tools/build-rtorrent-wsl.sh needs Linux x86-64
# and root) and handed to the Windows job as an artifact.
#
# Triggers:
#   * a version tag `v*` → builds both and attaches them to a GitHub Release.
#   * manual dispatch    → builds both, downloadable as workflow artifacts.
#
# Neither build is signed: the .app is ad-hoc signed (Gatekeeper warns on first
# launch) and the exe is unsigned (SmartScreen warns). See docs/release.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Needed to create the Release and upload assets on a tag.
permissions:
  contents: write

jobs:
  wsl-runtime:
    name: WSL runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Builds a static musl rtorrent in an Alpine chroot, packs a clean Alpine
      # rootfs around it and smoke-tests SCGI — all as root on this runner.
      - name: Build the rtorrent WSL rootfs
        run: sudo tools/build-rtorrent-wsl.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rtorrent-wsl-runtime
          path: |
            binaries/rtorrent-wsl/rstorrent-rootfs.tar.gz
            binaries/rtorrent-wsl/SHA256SUMS
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    # Also compiles rtorrent + libtorrent from source to stage the bundled
    # daemon, which adds a few minutes on top of the Rust build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # One command: stages the bundled rtorrent, builds the web console the
      # binary embeds, builds the release binary, assembles, signs (ad hoc)
      # and verifies dist-gpui/rstorrent-gpui.app.
      - name: Build the app
        run: tools/bundle-gpui-macos.sh

      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/gpui/Cargo.toml | head -1)
          zip="rstorrent-${version}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist-gpui/rstorrent-gpui.app "$zip"
          echo "ARTIFACT=$zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: rstorrent-macOS
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Publish to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            || echo "release already exists"
          gh release upload "$GITHUB_REF_NAME" "$ARTIFACT" --clobber

  windows:
    name: Windows
    needs: wsl-runtime
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rtorrent-wsl-runtime
          path: binaries/rtorrent-wsl

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Builds the web console if stale and the release exe, then lays out
      # dist-gpui\windows\rstorrent\ with the runtime and zips it.
      - name: Build and package the app
        shell: pwsh
        run: |
          ./tools/bundle-gpui-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem dist-gpui/windows/rstorrent-*-windows-x64.zip | Select-Object -First 1
          "ARTIFACT=$($zip.FullName.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: rstorrent-Windows
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Publish to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            || echo "release already exists"
          gh release upload "$GITHUB_REF_NAME" "$ARTIFACT" --clobber

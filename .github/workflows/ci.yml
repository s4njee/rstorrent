# CI for rstorrent (C21).
#
# Five jobs, split by what they actually need:
#
#   frontend — pure Node, so it runs on Linux where runners are fastest.
#   crate    — `rtorrent-core`, the shared client layer, has no UI and
#              builds anywhere, so it gets fmt/clippy/tests on Linux (cheap and
#              fast). A PR touching only crates/rtorrent gets Linux-speed feedback.
#   e2e      — the web console driven by Playwright against the mock server. It
#              needs the Rust binary and a browser, so it is its own Linux job.
#   gpui-macos / gpui-windows
#            — the native GPUI shell (`rstorrent-gpui`) on both platforms it
#              ships for. It links the web server as a library, and the server
#              embeds `dist-web` at compile time, so these build the web console
#              first. On Windows this also exercises build.rs's resource step
#              (icon + VERSIONINFO via rc.exe) and gpui's HLSL shaders (fxc.exe).
#
# Formatting is checked once, workspace-wide, in the (cheaper) crate job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run irrelevant; don't pay for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `install`) so the lockfile is authoritative and a drifted
      # lockfile fails here rather than resolving to something else silently.
      - run: npm ci

      - name: Lint (eslint + prettier)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Catches breakage that tsc alone misses — an unresolved import, a bad
      # asset reference — before it reaches a release build.
      - name: Build frontend
        run: npm run build

  crate:
    name: crate + server (Linux — fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # Formatting is platform-independent — check the whole workspace here so
      # the macOS job doesn't have to.
      - name: Formatting (workspace)
        run: cargo fmt --check --all

      # The shared crate and the web server have no UI dependencies, so they
      # build, lint, and test on Linux.
      - name: Clippy
        run: cargo clippy -p rtorrent-core -p rstorrent-web --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p rtorrent-core -p rstorrent-web

      # Build the web SPA the server embeds, so a broken web build fails here.
      - name: Build web UI
        run: npm ci && npm run build:web

  e2e:
    name: web console (Playwright against the mock server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The binary embeds `dist-web` at compile time, so build it first; the
      # suite's webServer then `cargo run`s the mock server.
      - name: Build web UI
        run: npm run build:web

      - name: End-to-end tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  gpui-macos:
    name: GPUI app (macOS — clippy, tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `server/src/assets.rs` embeds ../dist-web at compile time, and the GPUI
      # app links the server as a library.
      - name: Build web UI
        run: npm ci && npm run build:web

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # No bundled rtorrent is staged here, so build.rs warns that the app will
      # fall back to a system install; that is expected in CI.
      - name: Clippy
        run: cargo clippy -p rstorrent-gpui -p rtorrent-core --all-targets

      - name: Tests
        run: cargo test -p rstorrent-gpui -p rtorrent-core

  gpui-windows:
    name: GPUI app (Windows — clippy, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # See gpui-macos: the server half embeds dist-web at compile time.
      - name: Build web UI
        run: npm ci && npm run build:web

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Clippy
        run: cargo clippy -p rstorrent-gpui -p rtorrent-core --all-targets

      - name: Tests
        run: cargo test -p rstorrent-gpui -p rtorrent-core
